name: Build & Test

on:
  pull_request:
    branches: [ '*' ] # All branches

jobs:
  test:
    name: Test our current setup
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      #          check-latest: 'true'
      #          cache: 'maven'

      - name: Build the application
        run: mvn -B clean install -DskipTests=true

      - name: Unit tests
        run: mvn -B test --file pom.xml

  test-alternative-versions:
    name: Test with Java ${{ matrix.java }} (alternative setup)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '24', '21', '17', '11' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Unit tests
        run: mvn -B test --file pom.xml