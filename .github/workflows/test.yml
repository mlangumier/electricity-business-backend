name: Build & Test

on:
  pull_request:
    branches: [ '*' ] # All branches

jobs:
  test:
    name: Test the application
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      #          check-latest: 'true'
      #          cache: 'maven'

      - name: Install dependencies
        run: mvn -B clean install -DskipTests

      - name: Unit tests
        run: mvn -B test

